version: 2

builds:
  - id: nyx
    main: ./cmd/nyx
    binary: nyx
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/jpvelasco/nyx/internal/version.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: nyx
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "nyx_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
