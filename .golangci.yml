# .golangci.yml — run with: golangci-lint run ./...
# Core linters only (revive disabled to avoid pre-existing style churn on exported names, unused ctx params in interfaces, etc.)
version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-order: ["file"]

