version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/tools"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
