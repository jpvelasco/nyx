name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: CI (gosec → vet → test → build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC: lets the job mint a short-lived Codecov upload token
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Check (gosec → vet → test → build)
        run: make check

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          files: ./coverage.out
          # false: infra flakiness should not gate PRs
          fail_ci_if_error: false
