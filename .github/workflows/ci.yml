name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2

  # Lint on Windows as well — golangci-lint can fail on path separators,
  # case-sensitivity, and CRLF while passing on Linux, so the matrix must
  # cover it. Required context "Lint (Windows)"; keep branch protection in
  # sync when adding/renaming jobs (see AGENTS.md).
  lint-windows:
    name: Lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  build:
    name: Build
    strategy:
      # 3-OS matrix on every run (public repo — Actions minutes are unlimited).
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -v ./...
      - run: go vet ./...

  test:
    name: Test
    strategy:
      fail-fast: false  # one leg failing must not cancel the others' coverage uploads
      # 3-OS matrix on every run (public repo — Actions minutes are unlimited).
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # OIDC; lets each leg mint the Codecov upload token
    steps:
      # fetch-depth: 0 so Codecov can walk git history for path mapping and so
      # parent/base SHAs exist when the App compares PR head vs the default branch
      # (avoids "Missing base commit" / unusable reports on shallow clones).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Run in bash on every OS so the working directory and tooling are
      # consistent. Go on the Windows runner writes coverage.out with CRLF line
      # endings, which Codecov's parser rejects (the upload lands in an ERROR
      # state and never merges), so strip CR in the same step. tr is identical
      # on GNU/BSD/Git-bash; the strip is a no-op on Linux/macOS.
      - name: Run tests with coverage
        shell: bash
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          tr -d '\r' < coverage.out > coverage.tmp && mv coverage.tmp coverage.out
      # Upload per-OS coverage so Codecov merges all legs. A Linux-only report
      # understates true coverage; merging the OS matrix reflects it.
      # use_pypi: true — install CLI from PyPI instead of cli.codecov.io so we
      # skip native-binary GPG verification (fails with "Could not verify
      # signature" when key import is empty; codecov/codecov-action#1876).
      # fail_ci_if_error: false — Codecov is a soft gate; infra flakiness
      # must not fail the required test job and block valid PRs.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          use_pypi: true
          files: ./coverage.out
          fail_ci_if_error: false
      # JUnit XML for Codecov Test Analytics — Linux only (gotestsum).
      - name: Install gotestsum (Linux)
        if: runner.os == 'Linux'
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Generate JUnit XML (Linux)
        if: runner.os == 'Linux'
        run: gotestsum --junitfile junit.xml --format pkgname -- ./...
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && runner.os == 'Linux' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          use_pypi: true
          report_type: test_results
          files: ./junit.xml
          fail_ci_if_error: false
      # PR jobs must not receive the Codacy repository token. Save the report;
      # a trusted workflow_run workflow (codacy-coverage.yml) downloads this
      # artifact and uploads it to Codacy.
      - name: Save coverage for Codacy
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codacy-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run gosec
        # Keep this -exclude set in sync with .golangci.yml gosec.excludes
        # (single source of truth) so gosec and golangci suppress the same IDs.
        # Adjust the set to match the target repo's .golangci.yml.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude=G104,G204,G304,G704 ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
