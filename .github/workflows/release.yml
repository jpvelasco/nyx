name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse to re-cut an already-published version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Query the registry directly: `npm show` exit codes do not reliably
          # distinguish "version absent" from "registry unreachable". A
          # destructive re-cut (GoReleaser --clean swapping the hosted binaries
          # out from under an already-published npm package's immutable
          # checksums) is worse than a failed run, so anything that is not a
          # definitive 404 fails closed.
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/nyx-audit-cli/${VERSION}")"
          case "$STATUS" in
            404)
              echo "version ${VERSION} not present on npm — safe to proceed"
              ;;
            200)
              echo "::error::nyx-audit-cli@${VERSION} is already published — re-cutting ${GITHUB_REF_NAME} is not supported. Cut a new patch version, or (only if within 72h and nothing depends on it) npm unpublish the version and re-push the tag."
              exit 1
              ;;
            *)
              echo "::error::registry check for nyx-audit-cli@${VERSION} returned HTTP ${STATUS} — refusing to proceed (cannot prove the version is unpublished)."
              exit 1
              ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run verification (gosec → vet → coverage → build)
        run: make check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The guard below (first step after checkout) fails fast when the npm
        # version is already published, so a 422 on pre-existing assets can now
        # only mean "this run's npm publish never happened" — the first run's
        # assets and its published checksums.txt are still a coherent set, so
        # falling through to the npm publish is safe.
        continue-on-error: true

      - name: Verify release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' | sort > /tmp/asset_names.txt
          EXPECTED="checksums.txt
          nyx_${TAG#v}_darwin_amd64.tar.gz
          nyx_${TAG#v}_darwin_arm64.tar.gz
          nyx_${TAG#v}_linux_amd64.tar.gz
          nyx_${TAG#v}_linux_arm64.tar.gz
          nyx_${TAG#v}_windows_amd64.zip
          nyx_${TAG#v}_windows_arm64.zip"
          printf '%s\n' "$EXPECTED" | sort > /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/asset_names.txt; then
            echo "release is missing assets (or has unexpected extras) — refusing to publish npm" >&2
            exit 1
          fi
          echo "all 7 expected assets present"
          # Embed from the published asset, not the local rebuild: GoReleaser
          # rebuilds archives with different bytes (mtime-embedded), so dist/
          # would drift from the hosted binaries.
          URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name=="checksums.txt") | .browser_download_url')"
          curl -fsSL "$URL" -o dist/checksums.txt
          echo "embedded checksums synced to published asset"

      - name: Embed binary checksums into npm package
        run: node scripts/embed-checksums.js dist/checksums.txt npm/package.json

      - name: Publish npm package
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

      - name: Summary
        run: |
          echo "✅ Released ${GITHUB_REF_NAME}"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          echo "📦 Binaries + checksums attached via GoReleaser"
          echo "📦 npm: npm install -g nyx-audit-cli"
