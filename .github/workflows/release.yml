name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run verification (gosec → vet → coverage → build)
        run: make check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # pre-existing assets (422 already_exists) must not strand the npm publish

      - name: Verify release assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' | sort > /tmp/asset_names.txt
          EXPECTED="checksums.txt
          nyx_${TAG#v}_darwin_amd64.tar.gz
          nyx_${TAG#v}_darwin_arm64.tar.gz
          nyx_${TAG#v}_linux_amd64.tar.gz
          nyx_${TAG#v}_linux_arm64.tar.gz
          nyx_${TAG#v}_windows_amd64.zip
          nyx_${TAG#v}_windows_arm64.zip"
          printf '%s\n' "$EXPECTED" | sort > /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/asset_names.txt; then
            echo "release is missing assets (or has unexpected extras) — refusing to publish npm" >&2
            exit 1
          fi
          echo "all 7 expected assets present"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Embed binary checksums into npm package
        run: node scripts/embed-checksums.js dist/checksums.txt npm/package.json

      - name: Publish npm package
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

      - name: Summary
        run: |
          echo "✅ Released ${GITHUB_REF_NAME}"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          echo "📦 Binaries + checksums attached via GoReleaser"
          echo "📦 npm: npm install -g nyx-audit-cli"
