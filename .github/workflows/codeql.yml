name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # actions covers workflows; go uses autobuild so CodeQL analyzes compiled
        # code rather than source-only extraction. Add languages this repo uses.
        include:
          - language: actions
          - language: go
            build-mode: autobuild
          # Uncomment when this repo contains JavaScript or TypeScript (e.g. an
          # npm/release shim). Leaving it on with no JS/TS makes CodeQL error.
          # - language: javascript-typescript
          #   build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        with:
          category: "/language:${{ matrix.language }}"
